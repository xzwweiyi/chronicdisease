# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8028
  servlet:
    # 应用的访问路径
    context-path: /dchealthadmin
    # 请求/响应编码（防止中文乱码）
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.dchealth: debug
    org.springframework: warn

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: dev

# MyBatis配置
mybatis:
    # 搜索指定包别名
    typeAliasesPackage: com.dchealth.**.domain
    # 配置mapper的扫描，找到所有的mapper.xml映射文件
    mapperLocations: classpath*:mapper/**/*Mapper.xml
    # 加载全局的配置文件
    configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper: 
  # KingbaseES 使用 PG 方言（生成 LIMIT ? OFFSET ?）
  helperDialect: postgresql
  supportMethodsArguments: true
  params: count=countSql 

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: true
  # 请求前缀
  pathMapping: /dev-api

# 防止XSS攻击
xss: 
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
 #数据库密码加密盐值
jasypt:
  encryptor:
    password: dchealth 


image:
  # 拦截地址
  interceptPath: /dchealthadmin/**
  #拦截IP
  interceptIp: 172.100.45.*
  #旧域名
  oldDomain: https://td.dchealthclinical.com
  #新域名
  newDomain: http://172.100.45.33
  #图片IP转换域名拦截路径
  requestPath: /cms/*,/template/*,/research/info/*

# 语音盒（座席）拨号服务地址（占位，未配置则一键拨号不可用）
voicebox:
  url:

# 微信公众号模板消息（占位，接入公众号后填写）
wechat:
  gzh:
    appid:
    secret:

